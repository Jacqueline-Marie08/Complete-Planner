<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Planner</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📚 Student Planner</h1>
    <p>Stay organized and ahead of your assignments.</p>
  </header>

  <nav>
    <button>Dashboard</button>
    <button>Classes</button>
    <button>Assignments</button>
    <button>Grades</button>
    <button>Calendar</button>
    <button>Notes</button>
  </nav>

  <main>

    <section>
      <h2>Dashboard</h2>
      <div id="dashboard"></div>
    </section>

    <section>
      <h2>Classes</h2>
      <div id="classes"></div>
    </section>

    <section>
      <h2>Assignments</h2>
      <div id="assignments"></div>
    </section>

    <section>
      <h2>Grades</h2>
      <div id="grades"></div>
    </section>

    <section>
      <h2>Calendar</h2>
      <div id="calendar"></div>
    </section>

    <section>
      <h2>Notes</h2>
      <textarea id="notes"></textarea>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
